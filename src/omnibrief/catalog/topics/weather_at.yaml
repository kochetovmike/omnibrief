id: weather_at
title: "Weather warnings — Austria"
description: "GeoSphere Austria warnings at level orange or red, by Bundesland. Updates re-post as 'updated'."
kind: alert
cadence: { every: 1h, window: 3h }
render: { mode: template, template: weather_warning, hashtags: ["#Unwetter", "#Austria"] }
sources:
  - { id: geosphere, type: geosphere_warn }
filters:
  min_fields: { level: 2 }
material_fields: [level, start, end, laender]
attribution: [geosphere_warn]
