id: safety_gate
title: "EU product safety alerts (Safety Gate)"
description: "The weekly EU Safety Gate report on dangerous non-food products, grouped by category. Published Fridays; checked daily."
kind: digest
cadence: { every: 1d, window: 8d }
render: { mode: llm_digest, prompt: safety_gate, hashtags: ["#SafetyGate", "#recall"], max_input_items: 40 }
sources:
  - { id: safety_gate, type: safety_gate, params: { max_reports: 1 } }
filters:
  in_fields: { notifying_country: all }   # e.g. [Austria] to keep only alerts notified by Austria
material_fields: [level, measures]
attribution: [safety_gate]
