# Omnibrief configuration. Validated by `python -m omnibrief validate-config` (also in CI).
# Only source types on the licence allowlist (src/omnibrief/attribution.py, design §5) are accepted.

defaults:
  timeout_seconds: 20
  user_agent: "Omnibrief/0.1 (+https://github.com/kochetovmike/omnibrief)"

site:
  base_url: https://kochetovmike.github.io/omnibrief/
  entries_per_feed: 40         # max entries in the alert feed (14-day window)
  timezone: Europe/Vienna

llm:
  provider: gemini
  # Flash-Lite class, free tier. "-latest" aliases track Google's current model; pin an exact id
  # from Google AI Studio if output quality shifts unexpectedly.
  model: gemini-flash-lite-latest
  api_key_env: GEMINI_API_KEY
  max_input_items: 40          # overflow is listed as links only, not summarised
  max_output_tokens: 4000       # 40 bullets need ~3k; truncation => fallback

topics:
  - id: vulns
    title: "Vulnerability digest"
    language: en
    prompt_file: prompts/vulns.md
    filters:
      min_cvss: 7.0
      watchlist_env: VULNS_WATCHLIST       # Actions variable, comma-separated; never committed
      always_include_if: [kev, eu_exploited]
      epss_percentile_override: 0.99       # include regardless of watchlist above this
    discovery:
      - { id: cisa-kev, type: cisa_kev, url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json", lookback_days: 2 }
      - { id: nvd,      type: nvd,      url: "https://services.nvd.nist.gov/rest/json/cves/2.0", lookback_hours: 6, api_key_env: NVD_API_KEY }
      - { id: ghsa,     type: ghsa,     url: "https://api.github.com/advisories", advisory_type: reviewed, lookback_hours: 6, token_env: GITHUB_TOKEN }
      # - { id: euvd,   type: euvd,     url: "https://euvdservices.enisa.europa.eu", enabled: false }
      # - { id: cvelist,type: cvelist,  repo: "CVEProject/cvelistV5", role: nvd_fallback, enabled: false }
    enrichment:
      - { id: epss,     type: epss,     url: "https://api.first.org/data/v1/epss", batch_size: 100 }
    publishers: [atom]   # telegram, bluesky, threads: added in Phases 3b/3c

publishers:
  atom:
    type: atom           # always enabled; no configuration required
