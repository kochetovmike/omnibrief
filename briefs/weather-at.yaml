# yaml-language-server: $schema=../schema/brief.schema.json
schema_version: 3
id: weather-at
title: "Weather warnings: Austria"
description: "GeoSphere Austria warnings at level orange or red, by Bundesland. Updates re-post as 'updated'."
enabled: true
schedule: { every: 1h, lookback: 3h }
sources:
  - { id: geosphere, type: geosphere_warnings, licence: builtin }
filters:
  expr: "fields.level >= 2"
dedupe: { key: "{key}", material_fields: [level, start, end, laender] }
render: { mode: template, template: weather_warning }
outputs:
  - type: feed
  - type: telegram
    id: tg_alerts
    connection: tg_bot
    chat_id: { variable: TG_ALERTS_CHAT_ID }
    max_posts_per_run: 10
    quiet_hours: "23:00-06:00"
attribution:
  text: "Datenquelle: GeoSphere Austria, CC BY 4.0, modified."
  licence_url: https://creativecommons.org/licenses/by/4.0/
