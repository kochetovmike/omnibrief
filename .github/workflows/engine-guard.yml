name: engine-guard

# The engine repo must never contain instance/ (design-v2 §3.2): that's what keeps
# `git merge upstream/main` conflict-free in every fork. Forks (instances) pass automatically.

on:
  push:
  pull_request:

permissions: {}

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No instance/ in the engine repo
        env:
          ENGINE_REPO: kochetovmike/omnibrief   # the upstream engine; every other repo is an instance
          REPO: ${{ github.repository }}
        run: |
          if [ "$REPO" != "$ENGINE_REPO" ]; then echo "Instance repo ($REPO): instance/ is allowed."; exit 0; fi
          if [ -e instance ]; then
            echo "::error::instance/ must not exist in the engine repo. Instance config belongs in your fork."
            exit 1
          fi
          echo "OK: no instance/ in the engine repo."
