name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install --quiet -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check config, schemas and NOTICE are valid and up to date
        run: |
          python -m omnibrief check --offline
          python -m omnibrief schema --check
          python -m omnibrief notice --check

      - name: Test (offline)
        run: pytest
