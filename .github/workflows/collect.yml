name: collect

# Least privilege per job (design §9):
#   collect          contents: read + API secrets   — runs third-party code (pip deps); can't write anything
#   push-state       contents: write, no secrets    — commits ./data to the `data` branch; runs no project code
#   deploy           pages + id-token, no secrets   — deploys the site built by `collect`
#   deliver          contents: read + Telegram token — sends pending Telegram messages (after state is pushed)
#   push-deliveries  contents: write, no secrets    — records what was sent, so nothing is posted twice
# State is pushed before the site is deployed and before anything is posted (design §3).

on:
  schedule:
    - cron: "17 * * * *"     # hourly at :17 UTC, off the top-of-hour rush
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Also send a test message to the Telegram channel"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

permissions: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install --quiet .

      - name: Fetch current state from the data branch
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --quiet --depth=1 origin data
            git --work-tree=data checkout FETCH_HEAD -- .
            git reset --quiet   # leave main's index untouched
          else
            echo "No data branch yet; starting with empty state."
          fi

      - name: Collect, summarise, build site
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          VULNS_WATCHLIST: ${{ vars.VULNS_WATCHLIST }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}   # not secret; links the channel from the hub
        run: python -m omnibrief run --data ./data --site ./site --raw ./raw

      - name: Upload state
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: state
          path: data/
          retention-days: 1

      - name: Upload raw records (included records only)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raw-${{ github.run_id }}
          path: raw/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  push-state:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Switch to the data branch (orphan on first run) and clear the tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --quiet --depth=1 origin data
            git checkout --quiet -B data FETCH_HEAD
          else
            git checkout --quiet --orphan data
          fi
          # The state artifact is the complete new tree; `git add -A` below records deletions too.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: state
          path: .

      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git commit --quiet -m "data: run ${GITHUB_RUN_ID}"
          for attempt in 1 2; do
            if git push --quiet origin HEAD:data; then exit 0; fi
            echo "Push rejected (attempt ${attempt}); rebasing onto the remote data branch."
            git fetch --quiet origin data
            if ! git rebase --quiet FETCH_HEAD; then
              git rebase --abort
              echo "::error::Rebase conflict on the data branch; state for this run was not saved."
              exit 1
            fi
          done
          git push --quiet origin HEAD:data

  deploy:
    needs: push-state
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  deliver:
    needs: push-state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install --quiet .

      - name: Fetch the just-pushed state
        run: |
          mkdir -p data
          git fetch --quiet --depth=1 origin data
          git --work-tree=data checkout FETCH_HEAD -- .
          git reset --quiet

      - name: Deliver to Telegram (skipped silently if not configured)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          SEND_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.telegram_test }}
        run: |
          if [ "$SEND_TEST" = "true" ]; then
            python -m omnibrief deliver --data ./data --test
          else
            python -m omnibrief deliver --data ./data
          fi

      - name: Upload delivery records
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deliveries
          path: data/state/deliveries/
          if-no-files-found: ignore
          retention-days: 1

  push-deliveries:
    needs: deliver
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the data branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          fetch-depth: 1

      - name: Download delivery records
        id: download
        continue-on-error: true   # no artifact when no push publisher is configured
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deliveries
          path: state/deliveries

      - name: Commit and push
        if: steps.download.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/deliveries
          if git diff --cached --quiet; then
            echo "No delivery changes."
            exit 0
          fi
          git commit --quiet -m "data: deliveries ${GITHUB_RUN_ID}"
          for attempt in 1 2; do
            if git push --quiet origin HEAD:data; then exit 0; fi
            echo "Push rejected (attempt ${attempt}); rebasing onto the remote data branch."
            git fetch --quiet origin data
            if ! git rebase --quiet FETCH_HEAD; then
              git rebase --abort
              echo "::error::Rebase conflict; delivery records not saved (messages may be re-sent next run)."
              exit 1
            fi
          done
          git push --quiet origin HEAD:data
