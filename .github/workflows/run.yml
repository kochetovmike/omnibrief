name: run

# Omnibrief v2 (design-v2 §5). One hourly run; the planner decides which topics are due.
# INERT in the engine repo: every job is skipped unless instance/omnibrief.yaml exists (forks).
#
# Least privilege per job:
#   check            contents: read                      — does this repo have an instance?
#   run              contents: read + secrets (as JSON)  — runs pip-installed code; can't write anything
#   push-state       contents: write, no secrets         — commits data + archive branches; runs no project code
#   deploy           pages + id-token                     — deploys the site built by `run`
#   deliver          contents: read + secrets (as JSON)  — push channels, after state is durable
#   push-deliveries  contents: write, no secrets         — records what was sent (no double posts)
# Secrets reach the CLI as a pre-filtered JSON file, split by NAME CONVENTION so each job only gets
# what it needs (an instance can still name any env var without editing this engine-owned file):
#   run job      every secret EXCEPT push-channel ones (TELEGRAM_*, TG_*, BLUESKY_*, THREADS_*)
#   deliver job  ONLY push-channel secrets (TELEGRAM_*, TG_*, BLUESKY_*, THREADS_*)
#   neither      THREADS_REFRESH_PAT (only for a future refresh-threads-token.yml)
# Variables are not secret and are passed whole (OMNIBRIEF_VARS_JSON).

on:
  schedule:
    - cron: '0 * * * *'   # every hour, on the hour (UTC)
  workflow_dispatch:
    inputs:
      topics:
        description: "Force these topics now (comma-separated ids, or 'all'); empty = planner decides"
        type: string
        default: ""
      telegram_test:
        description: "Also send a test message to every configured Telegram channel"
        type: boolean
        default: false

concurrency:
  group: omnibrief-run
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      has_instance: ${{ steps.check.outputs.has_instance }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: instance
      - id: check
        run: |
          if [ -f instance/omnibrief.yaml ]; then echo "has_instance=true" >> "$GITHUB_OUTPUT";
          else echo "has_instance=false" >> "$GITHUB_OUTPUT"; echo "No instance/omnibrief.yaml: engine repo, nothing to do."; fi

  run:
    needs: check
    if: needs.check.outputs.has_instance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Select secrets for this job (push-channel secrets stay out)
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: >-
          echo "$ALL_SECRETS" | jq -c
          'with_entries(select(.key | test("^(TELEGRAM_|TG_|BLUESKY_|THREADS_|github_token$)") | not))'
          > "$RUNNER_TEMP/secrets.json"

      - name: Install
        run: python -m pip install --quiet .

      - name: Fetch state (data branch) and archive (archive branch)
        run: |
          for b in data archive; do
            mkdir -p "$b"
            if git ls-remote --exit-code --heads origin "$b" > /dev/null; then
              git fetch --quiet --depth=1 origin "$b"
              git --work-tree="$b" checkout FETCH_HEAD -- .
              git reset --quiet
            fi
          done

      - name: Validate instance
        run: python -m omnibrief validate-config

      - name: Run (plan → collect → store → publish)
        env:
          OMNIBRIEF_SECRETS_FILE: ${{ runner.temp }}/secrets.json
          OMNIBRIEF_VARS_JSON: ${{ toJSON(vars) }}
          GITHUB_TOKEN: ${{ github.token }}
          FORCE_TOPICS: ${{ github.event_name == 'workflow_dispatch' && inputs.topics || '' }}
        run: python -m omnibrief run --data ./data --site ./site --out ./out --archive ./archive --topics "$FORCE_TOPICS"

      - name: Upload state
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: state, path: data/, retention-days: 1 }

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: archive, path: archive/, retention-days: 1, if-no-files-found: ignore }

      - name: Upload raw records (artifact sink)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: "raw-${{ github.run_id }}", path: out/raw/, retention-days: 14, if-no-files-found: ignore }

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  push-state:
    needs: run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Switch to the data branch (orphan on first run) and clear the tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --quiet --depth=1 origin data
            git checkout --quiet -B data FETCH_HEAD
          else
            git checkout --quiet --orphan data
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: state, path: . }
      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit --quiet -m "data: run ${GITHUB_RUN_ID}"
          for attempt in 1 2; do
            if git push --quiet origin HEAD:data; then exit 0; fi
            git fetch --quiet origin data
            if ! git rebase --quiet FETCH_HEAD; then
              git rebase --abort; echo "::error::Rebase conflict on data; state not saved."; exit 1
            fi
          done
          git push --quiet origin HEAD:data

  push-archive:   # a sink: its failure never blocks deploy or delivery (design-v2 §7)
    needs: push-state
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Switch to the archive branch (orphan on first run) and clear the tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin archive > /dev/null; then
            git fetch --quiet --depth=1 origin archive
            git checkout --quiet -B archive FETCH_HEAD
          else
            git checkout --quiet --orphan archive
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
      - id: download
        continue-on-error: true   # absent when nothing was archived this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: archive, path: . }
      - name: Commit and push
        if: steps.download.outcome == 'success'
        run: |
          git add -A
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit --quiet -m "archive: run ${GITHUB_RUN_ID}"
          for attempt in 1 2; do
            if git push --quiet origin HEAD:archive; then exit 0; fi
            git fetch --quiet origin archive
            if ! git rebase --quiet FETCH_HEAD; then
              git rebase --abort; echo "::error::Rebase conflict on archive; not saved."; exit 1
            fi
          done
          git push --quiet origin HEAD:archive

  deploy:
    needs: push-state
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  deliver:
    needs: push-state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Select secrets for this job (push-channel secrets only)
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: >-
          echo "$ALL_SECRETS" | jq -c
          'with_entries(select((.key | test("^(TELEGRAM_|TG_|BLUESKY_|THREADS_)")) and .key != "THREADS_REFRESH_PAT"))'
          > "$RUNNER_TEMP/secrets.json"

      - run: python -m pip install --quiet .

      - name: Fetch the just-pushed state
        run: |
          mkdir -p data
          git fetch --quiet --depth=1 origin data
          git --work-tree=data checkout FETCH_HEAD -- .
          git reset --quiet

      - name: Deliver (channels without settings are skipped)
        env:
          OMNIBRIEF_SECRETS_FILE: ${{ runner.temp }}/secrets.json
          OMNIBRIEF_VARS_JSON: ${{ toJSON(vars) }}
          SEND_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.telegram_test }}
        run: |
          if [ "$SEND_TEST" = "true" ]; then python -m omnibrief deliver --data ./data --test
          else python -m omnibrief deliver --data ./data; fi

      - if: ${{ !cancelled() }}   # keep records of what WAS sent even if a later step failed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: deliveries, path: data/state/deliveries/, retention-days: 1, if-no-files-found: ignore }

  push-deliveries:
    needs: deliver
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          fetch-depth: 1

      - id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: deliveries, path: state/deliveries }

      - name: Commit and push
        if: steps.download.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/deliveries
          if git diff --cached --quiet; then echo "No delivery changes."; exit 0; fi
          git commit --quiet -m "data: deliveries ${GITHUB_RUN_ID}"
          for attempt in 1 2; do
            if git push --quiet origin HEAD:data; then exit 0; fi
            git fetch --quiet origin data
            if ! git rebase --quiet FETCH_HEAD; then
              git rebase --abort; echo "::error::Rebase conflict; delivery records not saved."; exit 1
            fi
          done
          git push --quiet origin HEAD:data
