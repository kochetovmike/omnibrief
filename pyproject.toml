[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "omnibrief"
version = "0.2.0"
description = "A hub for alerts: openly licensed vulnerability sources in, one filtered and summarised digest out."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "markdown>=3.7",
    "nh3>=0.2.18",
    "tenacity>=9.0",
    "jinja2>=3.1",          # v2 templates (alerts per channel, site theme)
    # zoneinfo needs an IANA database; Windows and slim images ship none.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.22", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/omnibrief"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # en dashes / bullets in user-facing strings are intentional
